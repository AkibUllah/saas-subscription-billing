name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check saas_billing tests scripts alembic
          ruff format --check saas_billing tests scripts alembic
      - name: Test
        run: pytest --cov=saas_billing --cov-report=term-missing
      - name: Import check + migrations on SQLite
        run: |
          python -c "from saas_billing.main import app; import saas_billing.cli"
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
      - name: Simulation smoke run
        run: python scripts/simulate.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: saas-subscription-billing:ci
